name: CI

# Every push and pull request is checked before it can reach production.
# Cloudflare deploys `main` automatically, so a green run here is the last gate.
on:
  push:
    branches: [main]
  pull_request:
  # Allows a re-run from the Actions tab without pushing a commit.
  workflow_dispatch:

# Grant the workflow token nothing beyond reading the repository.
permissions:
  contents: read

# A newer push makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types and Astro components
        run: npm run check

      - name: Run unit tests
        run: npm run test:coverage

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only the browsers named in playwright.config.ts.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # Builds the site and runs it in the real Cloudflare Workers runtime
      # against a stubbed GitHub, so the suite never hits a rate limit.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Live GitHub integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Confirms the real blog repository is still readable. Uses the workflow
      # token purely to raise GitHub's API rate limit.
      - name: Run integration tests
        run: npm run test:integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
