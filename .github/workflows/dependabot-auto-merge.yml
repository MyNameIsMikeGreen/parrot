name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's npm pull requests, so routine
# dependency updates land without anyone having to press a button.
#
# IMPORTANT: this workflow does not decide whether the tests passed. It asks
# GitHub to merge the pull request *once the branch's required status checks
# pass*. If `main` has no required status checks, auto-merge has nothing to wait
# for and the pull request merges immediately, tests or no tests.
#
# The required checks are therefore what actually protects `main`, not this
# file. `docs/dependencies.md` explains how to configure them, and the
# repository is not safely automated until that is done.
on: pull_request

# Dependabot's runs get a read-only token by default; enabling auto-merge needs
# more than that. Nothing else in this workflow uses the token.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Only Dependabot's npm updates.
    #
    # Updates to the workflow files themselves are deliberately excluded. The
    # built-in token has no permission to write GitHub Actions workflows, so
    # asking GitHub to auto-merge one fails, and granting that permission would
    # let a workflow rewrite itself. Those few pull requests are merged by hand
    # instead; `docs/dependencies.md` explains the reasoning.
    #
    # The branch prefix is how Dependabot names the ecosystem: npm updates are
    # `dependabot/npm_and_yarn/...`, actions `dependabot/github_actions/...`.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/')
    steps:
      # No checkout: this job never runs repository or dependency code, which is
      # what makes it safe to give it a write-capable token. For the same reason
      # it uses no third-party actions.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
